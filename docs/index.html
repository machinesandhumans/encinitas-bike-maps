<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encinitas Bike Maps</title>
<style>
:root{--bg:#f2f2ef;--fg:#18181a;--muted:#6e6e72;--line:#c9c9cc;--accent:#c4383c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0b;--fg:#e6e6e6;--muted:#8c8c90;--line:#333;--accent:#ff6b6b;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:56px max(16px,env(safe-area-inset-left,0px)) 72px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}p{color:var(--muted);margin:0 0 28px}
ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line);padding:14px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
a{color:var(--fg);font-weight:600}span{font:12px ui-monospace,Menlo,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
span.live{color:var(--accent)}
</style></head><body><main>
<h1>Encinitas Bike Maps</h1>
<p>Interactive maps of four Encinitas road projects, with official crash records before and after each change.</p>
<ul>
<li><a href="cardiff/">Coast Hwy 101, Cardiff cycle track</a><span class="live">Live prototype</span></li>
<li>Santa Fe Drive, west phase<span>Planned</span></li>
<li>Coast Hwy 101, Leucadia Streetscape<span>Planned</span></li>
<li>Quail Gardens Drive<span>Planned</span></li>
</ul>
</main></body></html>
